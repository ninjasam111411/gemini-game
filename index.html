<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber City - 3D FPS Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020205;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 16px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffff;
            box-shadow: 0 0 8px #00ffff;
        }
        #crosshair::before { top: 10px; left: 0; width: 24px; height: 4px; }
        #crosshair::after { top: 0; left: 10px; width: 4px; height: 24px; }
        
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 20, 0.95);
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            padding: 35px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
            cursor: pointer;
            border-radius: 10px;
            max-width: 500px;
        }
        #instructions h1 {
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
            margin-bottom: 15px;
            font-size: 30px;
            letter-spacing: 2px;
        }
        #instructions p {
            margin-bottom: 12px;
            color: #00ffff;
            font-size: 15px;
            line-height: 1.4;
        }
        #instructions button {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px #ff00ff;
            border-radius: 6px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        #instructions button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00ffff;
        }
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 255, 0.25);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.08s;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="crosshair"></div>
        <div id="flash"></div>
        <div id="ui">
            <div class="hud-top">
                <div id="scoreDisplay">SCORE: 000000</div>
                <div id="waveDisplay">SECTOR: 1</div>
                <div id="healthDisplay">SHIELD: 100%</div>
            </div>
            <div class="hud-bottom">
                <div id="ammoDisplay">AMMO: 30 / 30</div>
                <div id="controlsHint">WASD to Move | Mouse to Look | Left Click to Fire</div>
            </div>
        </div>
        <div id="instructions">
            <h1>NEON DISTRICT 2099</h1>
            <p>Patrol the cybernetic streets and eliminate rogue combat drones.</p>
            <p><b>WASD</b> to move smoothly through the city.</p>
            <p><b>Mouse</b> to look around & <b>Left Click</b> to shoot.</p>
            <button id="startBtn">INITIALIZE SIMULATION</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameStarted = false;
        let score = 0;
        let health = 100;
        let wave = 1;
        let ammo = 30;
        
        const player = {
            x: 0,
            y: 2.2,
            z: 0,
            angle: 0,
            pitch: 0,
            speed: 0.16
        };

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // Fixed non-inverted mouse look
        window.addEventListener('mousemove', e => {
            if (!gameStarted || document.pointerLockElement !== canvas) return;
            player.angle += e.movementX * 0.0022;
            player.pitch += e.movementY * 0.0022; // Fixed direction
            player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
        });

        canvas.addEventListener('click', () => {
            if (gameStarted) {
                canvas.requestPointerLock();
                shoot();
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('instructions').style.display = 'none';
            canvas.requestPointerLock();
            gameStarted = true;
        });

        const buildings = [];
        const targets = [];
        const particles = [];

        function initWorld() {
            for (let i = 0; i < 45; i++) {
                buildings.push({
                    x: (Math.random() - 0.5) * 220,
                    z: (Math.random() - 0.5) * 220,
                    width: 14 + Math.random() * 16,
                    height: 35 + Math.random() * 65,
                    depth: 14 + Math.random() * 16,
                    color: Math.random() > 0.5 ? '#ff00ff' : '#00ffff',
                    secondaryColor: Math.random() > 0.5 ? '#00ffff' : '#ff007f'
                });
            }
            spawnWave();
        }

        function spawnWave() {
            targets.length = 0;
            const count = 5 + wave * 3;
            for (let i = 0; i < count; i++) {
                targets.push({
                    x: (Math.random() - 0.5) * 130,
                    y: 2.5 + Math.random() * 7,
                    z: (Math.random() - 0.5) * 130,
                    radius: 3.5,
                    hp: 2,
                    angleOffset: Math.random() * Math.PI
                });
            }
        }

        function shoot() {
            if (ammo <= 0) {
                ammo = 30;
                return;
            }
            ammo--;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 60);

            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let dx = t.x - player.x;
                let dz = t.z - player.z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                let angleToTarget = Math.atan2(dz, dx);
                let angleDiff = Math.abs(player.angle - angleToTarget);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (dist < 55 && angleDiff < 0.22) {
                    t.hp--;
                    createSparks(t.x, t.y, t.z, '#00ffff');
                    if (t.hp <= 0) {
                        targets.splice(i, 1);
                        score += 350;
                        if (targets.length === 0) {
                            wave++;
                            spawnWave();
                        }
                    }
                    break;
                }
            }
        }

        function createSparks(x, y, z, color) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x, y, z,
                    vx: (Math.random() - 0.5) * 0.7,
                    vy: (Math.random() - 0.5) * 0.7,
                    vz: (Math.random() - 0.5) * 0.7,
                    life: 40,
                    color
                });
            }
        }

        function update() {
            if (!gameStarted) return;

            let moveX = 0;
            let moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { moveX += Math.cos(player.angle); moveZ += Math.sin(player.angle); }
            if (keys['KeyS'] || keys['ArrowDown']) { moveX -= Math.cos(player.angle); moveZ -= Math.sin(player.angle); }
            if (keys['KeyA'] || keys['ArrowLeft']) { moveX += Math.sin(player.angle); moveZ -= Math.cos(player.angle); }
            if (keys['KeyD'] || keys['ArrowRight']) { moveX -= Math.sin(player.angle); moveZ += Math.cos(player.angle); }

            player.x += moveX * player.speed;
            player.z += moveZ * player.speed;

            // Animate target drones hovering
            targets.forEach(t => {
                t.angleOffset += 0.05;
                t.y += Math.sin(t.angleOffset) * 0.04;
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.z += p.vz;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            document.getElementById('scoreDisplay').innerText = `SCORE: ${String(score).padStart(6, '0')}`;
            document.getElementById('waveDisplay').innerText = `SECTOR: ${wave}`;
            document.getElementById('healthDisplay').innerText = `SHIELD: ${health}%`;
            document.getElementById('ammoDisplay').innerText = `AMMO: ${ammo} / 30`;
        }

        function render() {
            let horizonY = canvas.height / 2 + player.pitch * 550;
            
            // Sky gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, '#020208');
            skyGrad.addColorStop(1, '#180830');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, horizonY);

            // Ground plane
            ctx.fillStyle = '#06030d';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            const fov = 600;

            // Draw glowing ground grid lines
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 1.8;
            for (let z = 1; z < 60; z += 2) {
                let pz = (z - (player.z % 2));
                if (pz <= 0) continue;
                let screenY = horizonY + (2.2 / pz) * fov;
                if (screenY > canvas.height) continue;
                
                ctx.beginPath();
                ctx.moveTo(0, screenY);
                ctx.lineTo(canvas.width, screenY);
                ctx.stroke();
            }

            const renderList = [];

            buildings.forEach(b => {
                let dx = b.x - player.x;
                let dz = b.z - player.z;
                let rx = dx * Math.cos(-player.angle) - dz * Math.sin(-player.angle);
                let rz = dx * Math.sin(-player.angle) + dz * Math.cos(-player.angle);
                if (rz > 0.5) renderList.push({ type: 'building', x: rx, z: rz, w: b.width, h: b.height, color: b.color, secColor: b.secondaryColor });
            });

            targets.forEach(t => {
                let dx = t.x - player.x;
                let dz = t.z - player.z;
                let rx = dx * Math.cos(-player.angle) - dz * Math.sin(-player.angle);
                let rz = dx * Math.sin(-player.angle) + dz * Math.cos(-player.angle);
                if (rz > 0.5) renderList.push({ type: 'target', x: rx, y: t.y, z: rz });
            });

            renderList.sort((a, b) => b.z - a.z);

            renderList.forEach(item => {
                let screenX = canvas.width / 2 + (item.x / item.z) * fov;
                let screenY = horizonY + ( (item.type === 'target' ? item.y : 0) / item.z) * fov;

                if (item.type === 'building') {
                    let w = (item.w / item.z) * fov;
                    let h = (item.h / item.z) * fov;
                    let x = screenX - w / 2;
                    let y = horizonY - h;

                    // Solid dark shaded building fill
                    ctx.fillStyle = '#0a0618';
                    ctx.fillRect(x, y, w, h);

                    // Cyberpunk window strips inside the building
                    ctx.fillStyle = item.secColor;
                    let windowCols = Math.floor(w / 10);
                    let windowRows = Math.floor(h / 15);
                    for (let r = 1; r < windowRows; r++) {
                        for (let c = 1; c < windowCols; c++) {
                            ctx.fillRect(x + c * 8, y + r * 12, 3, 6);
                        }
                    }

                    // Neon outline border
                    ctx.strokeStyle = item.color;
                    ctx.shadowColor = item.color;
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, w, h);
                    ctx.shadowBlur = 0;
                } 
                else if (item.type === 'target') {
                    // Solid glowing 3D drone rendering
                    let size = Math.max(8, fov / item.z * 1.8);
                    
                    ctx.fillStyle = '#ff1155';
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright core
                    ctx.fillStyle = '#00ffff';
                    ctx.shadowColor = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        initWorld();
        loop();
    </script>
</body>
</html>
