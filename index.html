<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon City FPS Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #ff00ff;
            box-shadow: 0 0 6px #ff00ff;
        }
        #crosshair::before { top: 8px; left: 0; width: 20px; height: 4px; }
        #crosshair::after { top: 0; left: 8px; width: 4px; height: 20px; }
        
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 15, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            padding: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
            cursor: pointer;
            border-radius: 8px;
        }
        #instructions h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-bottom: 15px;
            font-size: 28px;
        }
        #instructions p {
            margin-bottom: 10px;
            color: #00ffff;
            font-size: 14px;
        }
        #instructions button {
            background: #ff00ff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 10px #ff00ff;
            border-radius: 4px;
            font-family: inherit;
        }
        #instructions button:hover {
            background: #ff33ff;
            box-shadow: 0 0 15px #ff33ff;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="crosshair"></div>
        <div id="ui">
            <div class="hud-top">
                <div id="scoreDisplay">SCORE: 000000</div>
                <div id="waveDisplay">SECTOR: 1</div>
                <div id="healthDisplay">SHIELD: 100%</div>
            </div>
            <div class="hud-bottom">
                <div id="weaponDisplay">WEAPON: BLASTER [1]</div>
                <div id="controlsHint">WASD to Move | Mouse to Look | Click to Shoot</div>
            </div>
        </div>
        <div id="instructions">
            <h1>NEON DISTRICE 2099</h1>
            <p>Explore the cybernetic city and neutralize rogue automated drones.</p>
            <p><b>WASD / Arrow Keys</b> to navigate the streets.</p>
            <p><b>Mouse</b> to look around & <b>Left Click</b> to fire.</p>
            <button id="startBtn">INITIALIZE SIMULATION</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let gameStarted = false;
        let score = 0;
        let health = 100;
        let wave = 1;
        let currentWeapon = 0; // 0: Blaster, 1: Shotgun, 2: Laser
        
        // Player Position & Camera
        const player = {
            x: 0,
            y: 2.2, // Eye height
            z: 0,
            angle: 0,
            pitch: 0,
            speed: 0.15
        };

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // Mouse Look
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', e => {
            if (!gameStarted || document.pointerLockElement !== canvas) return;
            player.angle += e.movementX * 0.003;
            player.pitch -= e.movementY * 0.003;
            player.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, player.pitch));
        });

        canvas.addEventListener('click', () => {
            if (gameStarted) {
                canvas.requestPointerLock();
                shoot();
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('instructions').style.display = 'none';
            canvas.requestPointerLock();
            gameStarted = true;
        });

        // Entities in the city
        const npcs = []; // Citizens walking around
        const targets = []; // Rogue drones
        const particles = [];

        // Spawn city NPCs & Targets
        function initCity() {
            for (let i = 0; i < 30; i++) {
                npcs.push({
                    x: (Math.random() - 0.5) * 150,
                    z: (Math.random() - 0.5) * 150,
                    speed: 0.03 + Math.random() * 0.04,
                    dir: Math.random() * Math.PI * 2,
                    color: Math.random() > 0.5 ? '#00ffff' : '#ff00ff'
                });
            }
            spawnWave();
        }

        function spawnWave() {
            targets.length = 0;
            const count = 5 + wave * 3;
            for (let i = 0; i < count; i++) {
                targets.push({
                    x: (Math.random() - 0.5) * 120,
                    y: 2 + Math.random() * 5,
                    z: (Math.random() - 0.5) * 120,
                    radius: 2,
                    hp: 2,
                    color: '#ff3333'
                });
            }
        }

        function shoot() {
            // Audio click simulation via Web Audio API can be added here
            // Check targets hit in view ray
            let hit = false;
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let dx = t.x - player.x;
                let dz = t.z - player.z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                let angleToTarget = Math.atan2(dz, dx);
                let angleDiff = Math.abs(player.angle - angleToTarget);
                
                if (dist < 40 && angleDiff < 0.25) {
                    t.hp--;
                    createSparks(t.x, t.y, t.z, '#ff00ff');
                    if (t.hp <= 0) {
                        targets.splice(i, 1);
                        score += 250;
                        if (targets.length === 0) {
                            wave++;
                            spawnWave();
                        }
                    }
                    hit = true;
                    break;
                }
            }
        }

        function createSparks(x, y, z, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x, y, z,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    vz: (Math.random() - 0.5) * 0.4,
                    life: 30,
                    color
                });
            }
        }

        function update() {
            if (!gameStarted) return;

            // Movement
            let moveX = 0;
            let moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { moveX += Math.cos(player.angle); moveZ += Math.sin(player.angle); }
            if (keys['KeyS'] || keys['ArrowDown']) { moveX -= Math.cos(player.angle); moveZ -= Math.sin(player.angle); }
            if (keys['KeyA'] || keys['ArrowLeft']) { moveX += Math.sin(player.angle); moveZ -= Math.cos(player.angle); }
            if (keys['KeyD'] || keys['ArrowRight']) { moveX -= Math.sin(player.angle); moveZ += Math.cos(player.angle); }

            player.x += moveX * player.speed;
            player.z += moveZ * player.speed;

            // Update NPCs
            npcs.forEach(npc => {
                npc.x += Math.cos(npc.dir) * npc.speed;
                npc.z += Math.sin(npc.dir) * npc.speed;
                if (Math.random() < 0.02) npc.dir += (Math.random() - 0.5);
            });

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.z += p.vz;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // HUD Updates
            document.getElementById('scoreDisplay').innerText = `SCORE: ${String(score).padStart(6, '0')}`;
            document.getElementById('waveDisplay').innerText = `SECTOR: ${wave}`;
            document.getElementById('healthDisplay').innerText = `SHIELD: ${health}%`;
        }

        function render() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const fov = canvas.width < 800 ? 400 : 600;

            // Draw Sky / Horizon Grid background glow
            let horizonY = canvas.height / 2 + player.pitch * fov;

            ctx.fillStyle = '#0a0515';
            ctx.fillRect(0, 0, canvas.width, horizonY);

            // Draw Perspective Grid Floor
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 1.5;
            for (let z = 1; z < 50; z += 2) {
                let pz = (z - (player.z % 2));
                if (pz <= 0) continue;
                let screenY = horizonY + (2.2 / pz) * fov;
                if (screenY > canvas.height) continue;
                
                ctx.beginPath();
                ctx.moveTo(0, screenY);
                ctx.lineTo(canvas.width, screenY);
                ctx.stroke();
            }

            // Render NPCs and Targets (Sorted by depth)
            const renderList = [];

            npcs.forEach(npc => {
                let dx = npc.x - player.x;
                let dz = npc.z - player.z;
                let rx = dx * Math.cos(-player.angle) - dz * Math.sin(-player.angle);
                let rz = dx * Math.sin(-player.angle) + dz * Math.cos(-player.angle);
                if (rz > 0.2) renderList.push({ type: 'npc', x: rx, z: rz, color: npc.color });
            });

            targets.forEach(t => {
                let dx = t.x - player.x;
                let dz = t.z - player.z;
                let rx = dx * Math.cos(-player.angle) - dz * Math.sin(-player.angle);
                let rz = dx * Math.sin(-player.angle) + dz * Math.cos(-player.angle);
                if (rz > 0.2) renderList.push({ type: 'target', x: rx, y: t.y, z: rz, hp: t.hp });
            });

            // Sort back to front
            renderList.sort((a, b) => b.z - a.z);

            renderList.forEach(item => {
                let screenX = canvas.width / 2 + (item.x / item.z) * fov;
                let screenY = horizonY + ( (item.type === 'target' ? item.y : 2.2) / item.z) * fov;
                let size = Math.max(2, fov / item.z);

                if (item.type === 'npc') {
                    ctx.fillStyle = item.color;
                    ctx.shadowColor = item.color;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(screenX - size/4, screenY - size, size/2, size);
                    ctx.shadowBlur = 0;
                } else if (item.type === 'target') {
                    ctx.strokeStyle = '#00ffff';
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        initCity();
        loop();
    </script>
</body>
</html>
